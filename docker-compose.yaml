services:
  postgres:
    image: postgres:latest
    container_name: api.pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pg_root:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - api.network.pg
    env_file:
      - .env

  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - api.network
      - api.network.pg
    volumes:
      - ./src:/usr/api/src
    env_file:
      - .env
    command: python -m src
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "python", "-c", "import sys; sys.exit(0)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pg_root:

networks:
  api.network:
    name: api.network
    driver: bridge
  api.network.pg:
    name: api.network.pg
    driver: bridge