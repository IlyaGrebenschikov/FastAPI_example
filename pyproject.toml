[project]
name = "fastapi_example"
version = "0.1.0"
description = "FastAPI Example with layered architecture"
authors = [
    {name = "IlyaGrebenschikov", email = "ilushagr22@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "aiohttp>=3.13.3",
    "aiosmtplib>=5.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "faststream[cli,kafka]>=0.6.7",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.20",
    "redis>=8.1.0",
    "ruff>=0.16.1",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
]

[project.scripts]
api = "fastapi_example.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_example"]

[tool.ruff.lint.per-file-ignores]
"src/fastapi_example/infrastructure/database/migrations/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/fastapi_example"]

[[tool.mypy.overrides]]
module = [
    "fastapi_example.infrastructure.database.repositories.*",
    "fastapi_example.application.features.auth.services.token_jwt",
]
disable_error_code = ["arg-type"]
