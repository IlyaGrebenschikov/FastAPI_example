services:
  postgres:
    image: postgres:16-alpine
    container_name: fastapi_example.pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - fastapi_example_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fastapi_example.network.pg

  postgres_port_forwarder:
    image: alpine/socat:latest
    container_name: fastapi_example.pg.port_forwarder
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fastapi_example.network.pg
    command: ["tcp-listen:5432,fork,reuseaddr", "tcp-connect:postgres:5432"]

  redis:
    image: redis:7-alpine
    container_name: fastapi_example.redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - fastapi_example_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fastapi_example.network.redis

  redis_port_forwarder:
    image: alpine/socat:latest
    container_name: fastapi_example.redis.port_forwarder
    ports:
      - "127.0.0.1:6379:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_example.network.redis
    command: ["tcp-listen:6379,fork,reuseaddr", "tcp-connect:redis:6379"]

  kafka:
    image: apache/kafka:4.2.0
    container_name: fastapi_example.kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - fastapi_example_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fastapi_example.network.kafka

  kafka_port_forwarder:
    image: alpine/socat:latest
    container_name: fastapi_example.kafka.port_forwarder
    ports:
      - "127.0.0.1:9092:9092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fastapi_example.network.kafka
    command: ["tcp-listen:9092,fork,reuseaddr", "tcp-connect:kafka:9092"]

  maildev:
    image: djfarrelly/maildev:latest
    container_name: fastapi_example.maildev
    restart: unless-stopped
    networks:
      - fastapi_example.network.smtp

  maildev_smtp_port_forwarder:
    image: alpine/socat:latest
    container_name: fastapi_example.maildev.smtp.port_forwarder
    ports:
      - "127.0.0.1:1025:1025"
    depends_on:
      - maildev
    networks:
      - fastapi_example.network.smtp
    command: ["tcp-listen:1025,fork,reuseaddr", "tcp-connect:maildev:1025"]

  maildev_web_port_forwarder:
    image: alpine/socat:latest
    container_name: fastapi_example.maildev.web.port_forwarder
    ports:
      - "127.0.0.1:1080:1080"
    depends_on:
      - maildev
    networks:
      - fastapi_example.network.smtp
    command: ["tcp-listen:1080,fork,reuseaddr", "tcp-connect:maildev:1080"]


volumes:
  fastapi_example_pg:
  fastapi_example_redis:
  fastapi_example_kafka:


networks:
  fastapi_example.network:
    name: fastapi_example.network
    driver: bridge
  fastapi_example.network.pg:
    name: fastapi_example.network.pg
  fastapi_example.network.redis:
    name: fastapi_example.network.redis
  fastapi_example.network.kafka:
    name: fastapi_example.network.kafka
  fastapi_example.network.smtp:
    name: fastapi_example.network.smtp
